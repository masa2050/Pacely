# ローカル開発用の PostgreSQL。
# 本番は Supabase を使うため、これはあくまで「手元で開発・動作確認するためのDB」。
services:
  db:
    image: postgres:16
    container_name: pacely-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pacely
      POSTGRES_PASSWORD: pacely_local_pw
      POSTGRES_DB: pacely
    ports:
      # ホスト側5432が他のPostgresと衝突する場合は左側を変更する(例: "55432:5432")
      - "5432:5432"
    volumes:
      # 名前付きボリュームにデータを永続化(コンテナを消してもデータは残る)
      - pacely_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacely -d pacely"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pacely_pgdata:
